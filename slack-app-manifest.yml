display_information:
  name: Orbital Bot
  description: Alexander's helper for Orbital Roots
  background_color: "#1d3557"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Orbital Bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - im:read
      - im:write
      - channels:read
      - groups:read
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - reaction_added
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
